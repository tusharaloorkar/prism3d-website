<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prism3D — Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
  rel="stylesheet"
/>
<style>
  /* ──────────────────── RESET & BASE ──────────────────── */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:      #f0f9ff;
    --surface: #ffffff;
    --border:  rgba(14,165,233,.14);
    --text:    #0f172a;
    --muted:   #64748b;
    --purple:  #0ea5e9;
    --violet:  #38bdf8;
    --cyan:    #ec4899;
    --pink:    #f9a8d4;
    --gold:    #fbbf24;
    --ff-body: 'Space Grotesk', sans-serif;
    --ff-mono: 'Space Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--ff-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.022;
    pointer-events: none;
    z-index: 9997;
  }

  /* ──────────────────── TOP BAR ──────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 48px;
    max-width: 2000px; margin: 0 auto;
  }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--ff-mono); font-size: .72rem; letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted); text-decoration: none;
    transition: color .2s, transform .2s;
  }
  .back-link:hover { color: var(--purple); transform: translateX(-3px); }
  .top-brand { height: 28px; width: auto; display: block; }

  .cat-heading {
    text-align: center; padding: 8px 24px 8px;
  }
  .cat-lbl {
    font-family: var(--ff-mono); font-size: .68rem; letter-spacing: .42em;
    text-transform: uppercase; color: var(--violet); margin-bottom: 12px;
  }
  .cat-title {
    font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; letter-spacing: -.02em;
    margin-bottom: 10px;
  }
  .cat-sub {
    font-family: var(--ff-mono); font-size: .78rem; color: var(--muted);
    letter-spacing: .05em;
  }

  /* ──────────────────── CATALOGUE GRID ──────────────────── */
  .cat-stage {
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 24px 60px;
  }
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 24px;
    width: 100%; max-width: 2000px;
    margin: 0 auto;
  }
  .flip-card {
    position: relative;
    aspect-ratio: 1 / 1;
    perspective: 1400px;
    cursor: pointer;
  }
  .flip-card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .7s cubic-bezier(.45,.05,.4,1);
    transform-style: preserve-3d;
  }
  .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
  .flip-card-front, .flip-card-back {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 2px 4px 24px rgba(15,23,42,.14), 0 0 0 1px var(--border);
  }
  .flip-card-front { background: var(--surface); }
  .flip-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .5s ease;
  }
  .flip-card:not(.flipped):hover .flip-img { transform: scale(1.08); }
  .flip-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 16px;
    background: linear-gradient(180deg, transparent 40%, rgba(15,23,42,.68) 100%);
    opacity: 0; transition: opacity .35s ease;
  }
  .flip-card:not(.flipped):hover .flip-overlay { opacity: 1; }
  .flip-overlay span {
    font-family: var(--ff-mono); font-size: .68rem; letter-spacing: .16em;
    text-transform: uppercase; color: rgba(255,255,255,.92);
    border: 1px solid rgba(255,255,255,.5); padding: 8px 16px; border-radius: 30px;
  }
  .ph-img {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: color-mix(in srgb, var(--accent, var(--purple)) 6%, var(--bg));
    color: var(--accent, var(--purple));
  }
  .ph-img svg { opacity: .8; }
  .ph-img span {
    font-family: var(--ff-mono); font-size: .6rem; letter-spacing: .15em;
    text-transform: uppercase; opacity: .75;
  }
  .flip-card-back {
    transform: rotateY(180deg);
    background:
      radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--accent, var(--purple)) 14%, transparent), transparent 55%),
      var(--surface);
    padding: clamp(16px,5%,26px);
    display: flex; flex-direction: column; gap: 8px;
  }
  .flip-back-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .flip-cat {
    font-family: var(--ff-mono); font-size: .58rem; letter-spacing: .2em;
    text-transform: uppercase; color: var(--accent, var(--purple));
  }
  .flip-price {
    font-family: var(--ff-mono); font-weight: 700; font-size: .78rem;
    padding: 4px 12px; border-radius: 30px;
    background: color-mix(in srgb, var(--accent, var(--purple)) 12%, transparent);
    color: var(--accent, var(--purple));
    white-space: nowrap;
  }
  .flip-title {
    font-size: clamp(.92rem, 2vw, 1.15rem); font-weight: 700; letter-spacing: -.01em;
  }
  .flip-desc {
    font-size: .76rem; line-height: 1.45; color: var(--muted);
    flex: 1; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  }
  .order-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 14px; border-radius: 30px;
    background: #25d366; color: #fff; text-decoration: none;
    font-family: var(--ff-body); font-weight: 600; font-size: .78rem;
    box-shadow: 0 4px 16px rgba(37,211,102,.28);
    transition: transform .2s, box-shadow .2s;
  }
  .order-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,211,102,.4); }
  .order-btn svg { flex: none; }

  /* ── browse-more footer ── */
  .cat-footer {
    text-align: center; margin-top: 56px; max-width: 420px;
  }
  .cat-footer h2 { font-size: clamp(1.4rem, 3.5vw, 1.9rem); font-weight: 700; margin-bottom: 10px; }
  .soc-mini { display: flex; gap: 12px; margin-top: 18px; justify-content: center; flex-wrap: wrap; }
  .soc-mini a {
    font-family: var(--ff-mono); font-size: .68rem; letter-spacing: .1em;
    padding: 10px 18px; border-radius: 30px; text-decoration: none;
    color: #fff; background: #25d366;
  }
  .soc-mini a.ig { background: linear-gradient(135deg,#f58529,#dd2a7b,#8134af,#515bd4); }
  .soc-mini a.fb { background: #1877f2; }

  /* ──────────────────── RESPONSIVE ──────────────────── */
  @media (max-width: 1000px) {
    .cat-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 720px) {
    .topbar { padding: 22px 20px; }
  }
  @media (max-width: 640px) {
    .cat-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .flip-card-front, .flip-card-back { border-radius: 20px; }
    .flip-overlay span { font-size: .58rem; padding: 6px 10px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="../index.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Back home
  </a>
  <img src="../logo_1.png" alt="Prism3D" class="top-brand">
</div>

<div class="cat-heading">
  <p class="cat-lbl">The collection</p>
  <h1 class="cat-title">Browse our catalogue</h1>
  <p class="cat-sub">— &nbsp;hover to preview, tap a card to flip &nbsp;—</p>
</div>

<div class="cat-stage">
  <div class="cat-grid" id="catGrid"></div>

  <div class="cat-footer">
    <h2>Explore the full catalog</h2>
    <p class="cover-note">These are just our favourites. Browse everything — and request custom designs — on WhatsApp.</p>
    <div class="soc-mini">
      <a href="https://wa.me/918484080651" target="_blank" rel="noopener">WhatsApp</a>
      <a href="https://www.instagram.com/prism3d.in" target="_blank" rel="noopener" class="ig">Instagram</a>
      <a href="https://www.facebook.com/profile.php?id=61591418852121" target="_blank" rel="noopener" class="fb">Facebook</a>
    </div>
  </div>
</div>

<script src="../catalogue-data.js"></script>
<script>
/* ════════════════════════════════════════
   Product data lives in catalogue-data.js (shared with the homepage's
   embedded grid). Photos: catalogue/images/1.jpg, 2.jpg, ... matching
   product order in that file.
════════════════════════════════════════ */
function prismImgFallback(img) {
  const exts = ['jpg', 'jpeg', 'png', 'webp'];
  const idx = parseInt(img.dataset.ext, 10) + 1;
  if (idx < exts.length) {
    img.dataset.ext = idx;
    img.src = `${img.dataset.base}.${exts[idx]}`;
  } else {
    const ph = document.createElement('div');
    ph.className = 'ph-img';
    ph.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg><span>Photo</span>';
    img.replaceWith(ph);
  }
}

const waLink = (p) => `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(`Hi! I'd like to order: ${p.title} (${p.price}). Please confirm availability & payment details.`)}`;

const AUTO_UNFLIP_MS = 6000;
function scheduleAutoUnflip(el) {
  clearTimeout(el._unflipTimer);
  el._unflipTimer = setTimeout(() => el.classList.remove('flipped'), AUTO_UNFLIP_MS);
}

const container = document.getElementById('catGrid');
PRODUCTS.forEach((p, i) => {
  const el = document.createElement('div');
  el.className = 'flip-card';
  const imgBase = `images/${i + 1}`;
  el.innerHTML = `
    <div class="flip-card-inner">
      <div class="flip-card-front" style="--accent:${p.accent}">
        <img class="flip-img" src="${imgBase}.jpg" data-base="${imgBase}" data-ext="0" alt="${p.title}" loading="lazy" onerror="prismImgFallback(this)">
        <div class="flip-overlay"><span>Flip to know more</span></div>
      </div>
      <div class="flip-card-back" style="--accent:${p.accent}">
        <div class="flip-back-top">
          <span class="flip-cat">${p.cat}</span>
          <span class="flip-price">${p.price}</span>
        </div>
        <h3 class="flip-title">${p.title}</h3>
        <p class="flip-desc">${p.desc}</p>
        <a href="${waLink(p)}" target="_blank" rel="noopener" class="order-btn" onclick="event.stopPropagation()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Order Now
        </a>
      </div>
    </div>`;
  let isHovering = false;
  el.addEventListener('click', () => {
    const willFlip = !el.classList.contains('flipped');
    container.querySelectorAll('.flip-card.flipped').forEach((c) => {
      if (c !== el) { c.classList.remove('flipped'); clearTimeout(c._unflipTimer); }
    });
    el.classList.toggle('flipped', willFlip);
    if (willFlip) {
      if (!isHovering) scheduleAutoUnflip(el); // still hovering: wait for mouseleave to start the clock
    } else {
      clearTimeout(el._unflipTimer);
    }
  });
  el.addEventListener('mouseenter', () => { isHovering = true; clearTimeout(el._unflipTimer); });
  el.addEventListener('mouseleave', () => {
    isHovering = false;
    if (el.classList.contains('flipped')) scheduleAutoUnflip(el);
  });
  container.appendChild(el);
});
</script>
</body>
</html>
